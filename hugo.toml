baseURL = "https://aibelkingslayer.github.io/"
title = "Security Slayer"
theme = "mana"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableEmoji = true

[pagination]
  pageSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false
    style = "catppuccin-macchiato"

[outputs]
  home = ["HTML", "JSON"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  enableIntegrity = false
  relatedPostsCount = 3
  description = "Cybersecurity, penetration testing, and CTF writeups by Aibel. OSCP certified offensive security specialist."
  author = "Aibel"
  heroTitleLine1 = "SECURITY"
  heroTitleLine2 = "SLAYER"
  footerText = "Offensive security, penetration testing, and field notes."

  [params.social]
    github = "https://github.com/AibelKingslayer"
    linkedin = "https://linkedin.com/in/aibel-aju"

  [params.buyMeACoffee]
    enabled = false

  [params.codeHighlight]
    darkTheme = "catppuccin-macchiato"
    lightTheme = "catppuccin-frappe"

  [params.copyright]
    startYear = 2025
    owner = "Aibel"

  [params.admonitions]
    alertStyle = "favicon"

[[menus.main]]
  name = "Home"
  pageRef = "/"
  weight = 10

[[menus.main]]
  name = "Posts"
  pageRef = "/posts"
  weight = 20

[[menus.main]]
  name = "Tags"
  pageRef = "/tags"
  weight = 30

[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 40
