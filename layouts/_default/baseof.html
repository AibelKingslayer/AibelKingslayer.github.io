<!DOCTYPE html>
<html lang="{{ .Site.Language }}">

  <body>
    <div class="site-noise" aria-hidden="true"></div>
    <div class="reading-progress" aria-hidden="true"></div>
    <div class="container">
      {{ partial "header.html" . }}
      {{ block "main" . }}{{ end }}
      {{ block "footer" . }}{{ partial "footer.html" . }}{{ end }}

    {{ partial "javascript.html" . }}
  </body>
</html>
